<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard - Vulnerability Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-card.critical {
            border-left: 5px solid #dc3545;
        }

        .stat-card.high {
            border-left: 5px solid #fd7e14;
        }

        .stat-card.medium {
            border-left: 5px solid #ffc107;
        }

        .stat-card.low {
            border-left: 5px solid #28a745;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .chart-container h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }

        .vulnerability-list {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .vulnerability-item {
            border-left: 4px solid #667eea;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .vulnerability-item:hover {
            background: #e9ecef;
        }

        .vulnerability-item h3 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .vulnerability-item p {
            color: #666;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .badge.critical {
            background: #dc3545;
            color: white;
        }

        .badge.high {
            background: #fd7e14;
            color: white;
        }

        .badge.medium {
            background: #ffc107;
            color: #333;
        }

        .badge.low {
            background: #28a745;
            color: white;
        }

        .last-updated {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        canvas {
            max-height: 400px;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: white;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Security Dashboard</h1>
            <p>Real-time Vulnerability Management & Compliance Tracking</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card critical">
                <div class="stat-label">Critical</div>
                <div class="stat-value" id="criticalCount">-</div>
            </div>
            <div class="stat-card high">
                <div class="stat-label">High</div>
                <div class="stat-value" id="highCount">-</div>
            </div>
            <div class="stat-card medium">
                <div class="stat-label">Medium</div>
                <div class="stat-value" id="mediumCount">-</div>
            </div>
            <div class="stat-card low">
                <div class="stat-label">Low</div>
                <div class="stat-value" id="lowCount">-</div>
            </div>
        </div>

        <div class="chart-container">
            <h2>📊 Vulnerability Trends</h2>
            <canvas id="trendChart"></canvas>
        </div>

        <div class="vulnerability-list">
            <h2>🔍 Recent Findings</h2>
            <div id="vulnerabilityList" class="loading">
                Loading vulnerability data...
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">
            Last updated: Loading...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // Load security data
        async function loadSecurityData() {
            try {
                const response = await fetch('security-data.json');
                const data = await response.json();
                
                // Update stats
                document.getElementById('criticalCount').textContent = data.summary.critical || 0;
                document.getElementById('highCount').textContent = data.summary.high || 0;
                document.getElementById('mediumCount').textContent = data.summary.medium || 0;
                document.getElementById('lowCount').textContent = data.summary.low || 0;
                
                // Update vulnerability list
                const listContainer = document.getElementById('vulnerabilityList');
                if (data.vulnerabilities && data.vulnerabilities.length > 0) {
                    listContainer.innerHTML = data.vulnerabilities.map(vuln => `
                        <div class="vulnerability-item">
                            <h3>
                                <span class="badge ${vuln.severity.toLowerCase()}">${vuln.severity}</span>
                                ${vuln.id || 'N/A'}
                            </h3>
                            <p><strong>${vuln.title}</strong></p>
                            <p>${vuln.description || 'No description available'}</p>
                            <p><small>Package: ${vuln.package || 'N/A'} | Source: ${vuln.source || 'N/A'}</small></p>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = '<p style="text-align: center; color: #28a745; font-size: 1.2rem;">✅ No vulnerabilities found!</p>';
                }
                
                // Update chart
                createTrendChart(data.trends || []);
                
                // Update timestamp
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${new Date(data.timestamp || Date.now()).toLocaleString()}`;
                    
            } catch (error) {
                console.error('Error loading security data:', error);
                document.getElementById('vulnerabilityList').innerHTML = 
                    '<p style="text-align: center; color: #dc3545;">❌ Error loading data. Please check security-data.json file.</p>';
            }
        }

        function createTrendChart(trends) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            // Sample data if no trends provided
            const defaultTrends = [
                { date: 'Week 1', critical: 2, high: 5, medium: 8, low: 3 },
                { date: 'Week 2', critical: 1, high: 4, medium: 6, low: 2 },
                { date: 'Week 3', critical: 0, high: 3, medium: 5, low: 1 },
                { date: 'Week 4', critical: 0, high: 2, medium: 3, low: 1 }
            ];
            
            const data = trends.length > 0 ? trends : defaultTrends;
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [
                        {
                            label: 'Critical',
                            data: data.map(d => d.critical),
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'High',
                            data: data.map(d => d.high),
                            borderColor: '#fd7e14',
                            backgroundColor: 'rgba(253, 126, 20, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Medium',
                            data: data.map(d => d.medium),
                            borderColor: '#ffc107',
                            backgroundColor: 'rgba(255, 193, 7, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Low',
                            data: data.map(d => d.low),
                            borderColor: '#28a745',
                            backgroundColor: 'rgba(40, 167, 69, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // Load data on page load
        loadSecurityData();
        
        // Refresh every 5 minutes
        setInterval(loadSecurityData, 300000);
    </script>
</body>
</html>
