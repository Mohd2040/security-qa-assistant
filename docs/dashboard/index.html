<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard - Vulnerability Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 1.8rem;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .header-content p {
            color: #718096;
        }

        .score-card {
            text-align: center;
            padding: 1rem 2rem;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3748;
        }

        .score-label {
            font-size: 0.9rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card.critical { border-top: 4px solid #e53e3e; }
        .stat-card.high { border-top: 4px solid #dd6b20; }
        .stat-card.medium { border-top: 4px solid #d69e2e; }
        .stat-card.low { border-top: 4px solid #38a169; }

        .stat-label {
            font-size: 0.85rem;
            color: #718096;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: #2d3748;
        }

        .chart-container {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            height: 400px;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem;
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.critical { background: #fed7d7; color: #c53030; }
        .badge.high { background: #feebc8; color: #c05621; }
        .badge.medium { background: #fefcbf; color: #b7791f; }
        .badge.low { background: #c6f6d5; color: #2f855a; }

        .source-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #edf2f7;
            color: #4a5568;
        }

        .link-icon {
            text-decoration: none;
            color: #4299e1;
            font-weight: 600;
        }

        .link-icon:hover {
            text-decoration: underline;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🛡️ Security Center</h1>
                <p>Real-time Vulnerability Management Dashboard</p>
                <div id="lastUpdated" style="font-size: 0.85rem; margin-top: 0.5rem; color: #a0aec0;"></div>
            </div>
            <div class="score-card">
                <div class="score-value" id="securityScore">-</div>
                <div class="score-label">Security Score</div>
            </div>
        </div>

        <div class="grid-container">
            <div class="stats-grid">
                <div class="stat-card critical">
                    <div class="stat-label">Critical</div>
                    <div class="stat-value" id="criticalCount">-</div>
                </div>
                <div class="stat-card high">
                    <div class="stat-label">High</div>
                    <div class="stat-value" id="highCount">-</div>
                </div>
                <div class="stat-card medium">
                    <div class="stat-label">Medium</div>
                    <div class="stat-value" id="mediumCount">-</div>
                </div>
                <div class="stat-card low">
                    <div class="stat-label">Low</div>
                    <div class="stat-value" id="lowCount">-</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>🏆 Top 20 Findings</h2>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Severity</th>
                            <th>Vulnerability</th>
                            <th>Package</th>
                            <th>Source</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="vulnerabilityTable">
                        <tr><td colspan="5" style="text-align: center;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        async function loadData() {
            try {
                const response = await fetch('security-data.json');
                const data = await response.json();
                
                // Update Score
                const score = data.summary.score || 0;
                const scoreEl = document.getElementById('securityScore');
                scoreEl.textContent = score;
                scoreEl.style.color = score >= 90 ? '#38a169' : (score >= 70 ? '#d69e2e' : '#e53e3e');

                // Update Stats
                document.getElementById('criticalCount').textContent = data.summary.critical;
                document.getElementById('highCount').textContent = data.summary.high;
                document.getElementById('mediumCount').textContent = data.summary.medium;
                document.getElementById('lowCount').textContent = data.summary.low;
                document.getElementById('lastUpdated').textContent = `Last updated: ${new Date(data.timestamp).toLocaleString()}`;

                // Update Table
                const tbody = document.getElementById('vulnerabilityTable');
                if (data.vulnerabilities && data.vulnerabilities.length > 0) {
                    tbody.innerHTML = data.vulnerabilities.map(v => `
                        <tr>
                            <td><span class="badge ${v.severity.toLowerCase()}">${v.severity}</span></td>
                            <td>${v.title}</td>
                            <td><code>${v.package || 'N/A'}</code></td>
                            <td><span class="source-badge">${v.source}</span></td>
                            <td>${v.link ? `<a href="${v.link}" target="_blank" class="link-icon">Fix ↗</a>` : '-'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">✅ No vulnerabilities found!</td></tr>';
                }

                // Update Chart
                renderChart(data.trends || []);

            } catch (e) {
                console.error("Error loading data:", e);
                document.getElementById('vulnerabilityTable').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error loading data</td></tr>';
            }
        }

        function renderChart(trends) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            // If no trends, use current data as single point or empty
            const labels = trends.map(t => t.date);
            const criticalData = trends.map(t => t.critical);
            const highData = trends.map(t => t.high);
            const scoreData = trends.map(t => t.score);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Security Score',
                            data: scoreData,
                            borderColor: '#4a5568',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            yAxisID: 'y1',
                            tension: 0.4,
                            pointRadius: 0
                        },
                        {
                            label: 'Critical',
                            data: criticalData,
                            borderColor: '#e53e3e',
                            backgroundColor: 'rgba(229, 62, 62, 0.1)',
                            fill: true,
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: 'High',
                            data: highData,
                            borderColor: '#dd6b20',
                            backgroundColor: 'rgba(221, 107, 32, 0.1)',
                            fill: true,
                            tension: 0.4,
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Security Trend (Last 30 Scans)' }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Vulnerabilities' }
                        },
                        y1: {
                            beginAtZero: true,
                            max: 100,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Score' }
                        }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>
