services:
  app:
    image: ghcr.io/mohd2040/security-qa-assistant:latest
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mongodb/mongodb-atlas-local:latest
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=mongo_user
      - MONGODB_INITDB_ROOT_PASSWORD=mongo_pass
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
      - ./data/configdb:/data/configdb
      - ./data/mongot:/data/mongot
    restart: unless-stopped