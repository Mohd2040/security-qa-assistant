services:
  - type: web
    name: security-qa-assistant
    env: docker
    plan: free
    region: frankfurt
    branch: devops3
    # If using GHCR image (faster builds):
    # image: ghcr.io/YOUR_USERNAME/security-qa-assistant-new:latest
    # If building from source on Render (slower):
    buildCommand: docker build -t app .
    startCommand: ./server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
