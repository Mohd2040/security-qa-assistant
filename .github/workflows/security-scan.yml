name: Security Vulnerability Test

on:
  push:
    branches: [ "devops3" ]
  pull_request:
    branches: [ "devops3" ]
  #schedule:
    # Run every Monday at 2 AM UTC for periodic assessment
    #- cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: 'https://security-qa-assistant.onrender.com/'
      dast_auth_enabled:
        description: 'Enable authenticated DAST scanning'
        required: false
        type: boolean
        default: false
      dast_login_url:
        description: 'Login page URL for authenticated scanning'
        required: false
        type: string
        default: 'https://security-qa-assistant.onrender.com/api/auth/signin'
      dast_username_field:
        description: 'Username field name in login form'
        required: false
        type: string
        default: 'username'
      dast_password_field:
        description: 'Password field name in login form'
        required: false
        type: string
        default: 'password'
      dast_success_indicator:
        description: 'URL pattern or text indicating successful login'
        required: false
        type: string
        default: 'dashboard'
      defectdojo_enabled:
        description: 'Enable DefectDojo integration'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  call-security-scan:
    name: Run Security Scan
    uses: ./.github/workflows/reusable-security.yml
    with:
      project_type: 'node'
      run_trivy: true
      run_npm_audit: true
      run_codeql: true
      dast_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_url || 'https://security-qa-assistant.onrender.com/' }}
      dast_auth_enabled: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_auth_enabled || false }}
      dast_login_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_login_url || 'https://security-qa-assistant.onrender.com/api/auth/signin' }}
      dast_username_field: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_username_field || 'username' }}
      dast_password_field: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_password_field || 'password' }}
      dast_success_indicator: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_success_indicator || 'dashboard' }}
      defectdojo_enabled: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defectdojo_enabled || true }}
    secrets:
      dast_username: ${{ secrets.DAST_USERNAME }}
      dast_password: ${{ secrets.DAST_PASSWORD }}
      defectdojo_url: ${{ secrets.DEFECTDOJO_URL }}
      defectdojo_token: ${{ secrets.DEFECTDOJO_TOKEN }}
      defectdojo_product_id: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}