name: Security Vulnerability Test

on:
  push:
    branches: [ "main", "master", "devops3" ]
  pull_request:
    branches: [ "main", "master", "devops3" ]
  workflow_dispatch:
    inputs:
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: ''

jobs:
  call-security-scan:
    name: Run Security Scan
    uses: ./.github/workflows/reusable-security.yml
    with:
      project_type: 'node'
      run_trivy: true
      run_npm_audit: true
      dast_url: ${{ inputs.dast_url || '' }}
