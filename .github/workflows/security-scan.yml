name: Security Vulnerability Test

on:
  push:
    branches: [ "main", "master", "devops3" ]
  pull_request:
    branches: [ "main", "master", "devops3" ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (Dependency Scan)
        # Run audit, save to json, and don't fail the build immediately so we can see other reports
        run: npm audit --json > npm-audit-report.json || true
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Trivy Config Scanner (Misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-config-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Scan Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            npm-audit-report.json
            trivy-fs-report.txt
            trivy-config-report.txt
