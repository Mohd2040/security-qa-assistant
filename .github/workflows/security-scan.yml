name: Security Vulnerability Test

on:
  push:
    branches: [ "devops3" ]
  pull_request:
    branches: [ "devops3" ]
  schedule:
    # Run every Monday at 2 AM UTC for periodic assessment
    #- cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: 'https://security-qa-assistant.onrender.com'

jobs:
  call-security-scan:
    name: Run Security Scan
    uses: ./.github/workflows/reusable-security.yml
    with:
      project_type: 'node'
      run_trivy: true
      run_npm_audit: true
      dast_url: ${{ inputs.dast_url || '' }}
