name: Security Vulnerability Test

on:
  push:
    branches: [ "devops3" ]
  pull_request:
    branches: [ "devops3" ]
  #schedule:
    # Run every Monday at 2 AM UTC for periodic assessment
    #- cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      runner_labels:
        required: false
        type: string
        #default: '["self-hosted", "ubuntudevops"]'
        default: '["ubuntu-latest"]'

      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: 'https://security-qa-assistant.onrender.com/'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  call-security-scan:
    name: Run Security Scan
    uses: Mohd2040/security-qa-assistant/.github/workflows/reusable-security.yml@devops3
    with:
      #runner_labels: '["self-hosted", "ubuntudevops"]'
      runner_labels: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner_labels || '["ubuntu-latest"]' }}
      project_type: 'auto'
      run_trivy_sca: true
      run_npm_audit: false
      run_codeql: true
    #  defectdojo_enabled: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    #  defectdojo_auto_create: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      dast_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_url || 'https://security-qa-assistant.onrender.com/' }}
    secrets: inherit