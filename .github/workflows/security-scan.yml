name: Security Vulnerability Test

on:
  push:
    branches: [ "devops3" ]
  pull_request:
    branches: [ "devops3" ]
  #schedule:
    # Run every Monday at 2 AM UTC for periodic assessment
    #- cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: 'https://security-qa-assistant.onrender.com/'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  call-security-scan:
    name: Run Security Scan
    uses: ./.github/workflows/reusable-security.yml
    with:
      project_type: 'node'
      run_trivy: true
      run_npm_audit: true
      run_codeql: true
      dast_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_url || 'https://security-qa-assistant.onrender.com/' }}
  
  notify-slack:
    needs: call-security-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🔒 Security Scan Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Status:* Completed\n*Dashboard:* https://YOUR-USERNAME.github.io/security-qa-assistant/"
                  }
                }
              ]
            }