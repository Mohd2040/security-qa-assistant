name: Reusable Security Scan (Enhanced Reporting)

on:
  workflow_call:
    inputs:
      project_type:
        description: 'Project type (node, dotnet, etc.)'
        required: false
        type: string
        default: 'node'
      run_trivy:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      run_npm_audit:
        description: 'Run npm audit'
        required: false
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL analysis'
        required: false
        type: boolean
        default: false
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      # ═══════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════
      
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        if: ${{ inputs.project_type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        if: ${{ inputs.project_type == 'node' }}
        run: npm ci --prefer-offline --no-audit

      # ═══════════════════════════════════════════
      # SCA - Software Composition Analysis
      # ═══════════════════════════════════════════
      
      - name: 🔍 SCA - npm Audit
        id: sca
        if: ${{ inputs.project_type == 'node' && inputs.run_npm_audit }}
        run: |
          echo "## 🔍 SCA - Software Composition Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Generate JSON report
          npm audit --json > npm-audit.json || true
          
          # Extract metrics
          if [ -f npm-audit.json ]; then
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit.json)
            TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit.json)
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Save to outputs
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** npm audit (built-in)" >> $GITHUB_STEP_SUMMARY
            echo "- **Database:** npm registry + GitHub Advisory Database" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage:** JavaScript/Node.js dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
              echo "**⚠️ Action Required:**" >> $GITHUB_STEP_SUMMARY
              echo '```bash' >> $GITHUB_STEP_SUMMARY
              echo "# Run automatic fix" >> $GITHUB_STEP_SUMMARY
              echo "npm audit fix" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "# For breaking changes" >> $GITHUB_STEP_SUMMARY
              echo "npm audit fix --force" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              
              # Show top vulnerable packages
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Top Vulnerable Packages:**" >> $GITHUB_STEP_SUMMARY
              jq -r '.vulnerabilities | to_entries | 
                sort_by(.value.severity) | 
                reverse | 
                .[0:5] | 
                .[] | 
                "- `\(.key)` - \(.value.severity | ascii_upcase) - \(.value.via[0].title // "No title")"' \
                npm-audit.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            else
              echo "✅ No critical or high vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
              echo "- Continue monitoring for new vulnerabilities" >> $GITHUB_STEP_SUMMARY
              echo "- Keep dependencies up to date" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      # ═══════════════════════════════════════════
      # SAST - Static Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🛡️ SAST - Trivy Filesystem Scan
        id: sast
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: 'node_modules'
          exit-code: '0'
        continue-on-error: true

      - name: 📊 SAST - Process Results
        if: ${{ inputs.run_trivy }}
        run: |
          echo "## 🛡️ SAST - Static Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f trivy-fs.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json)
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs.json)
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs.json)
            TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** Aquasecurity Trivy" >> $GITHUB_STEP_SUMMARY
            echo "- **Database:** Trivy DB (NVD, GitHub Advisories, etc.)" >> $GITHUB_STEP_SUMMARY
            echo "- **Scan Type:** Filesystem (code + dependencies)" >> $GITHUB_STEP_SUMMARY
            echo "- **Languages Detected:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]? | select(.Target) | "  - \(.Type // "Unknown"): \(.Target)"' trivy-fs.json | sort -u >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
              echo "**⚠️ Action Required:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Show top vulnerabilities
              echo "**Top Critical/High Vulnerabilities:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
              
              jq -r '.Results[]?.Vulnerabilities[]? | 
                select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
                "| \(.VulnerabilityID) | \(.Severity) | `\(.PkgName)` | \(.InstalledVersion) | \(.FixedVersion // "N/A") |"' \
                trivy-fs.json | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
              
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Steps to Fix:**" >> $GITHUB_STEP_SUMMARY
              echo "1. Update affected packages to fixed versions" >> $GITHUB_STEP_SUMMARY
              echo "2. If no fix available, consider alternatives or apply workarounds" >> $GITHUB_STEP_SUMMARY
              echo "3. Review Trivy recommendations in detailed report" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical or high SAST vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
              echo "- Code analysis shows no major security issues" >> $GITHUB_STEP_SUMMARY
              echo "- Continue following secure coding practices" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Trivy scan did not produce results" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # IaC - Infrastructure as Code
      # ═══════════════════════════════════════════
      
      - name: 🏗️ IaC - Trivy Config Scan
        id: iac
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-config.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        continue-on-error: true

      - name: 📊 IaC - Process Results
        if: ${{ inputs.run_trivy }}
        run: |
          echo "## 🏗️ IaC - Infrastructure as Code Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f trivy-config.json ]; then
            CRITICAL=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL")] | length' trivy-config.json)
            HIGH=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH")] | length' trivy-config.json)
            MEDIUM=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="MEDIUM")] | length' trivy-config.json)
            LOW=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="LOW")] | length' trivy-config.json)
            TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** Trivy Config Scanner" >> $GITHUB_STEP_SUMMARY
            echo "- **Checks:** CIS Benchmarks, Best Practices" >> $GITHUB_STEP_SUMMARY
            echo "- **Supported Formats:**" >> $GITHUB_STEP_SUMMARY
            echo "  - Dockerfile" >> $GITHUB_STEP_SUMMARY
            echo "  - Kubernetes (YAML)" >> $GITHUB_STEP_SUMMARY
            echo "  - Terraform" >> $GITHUB_STEP_SUMMARY
            echo "  - Docker Compose" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Files scanned
            echo "**Files Scanned:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]? | select(.Misconfigurations) | "- `\(.Target)`"' trivy-config.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- No IaC files found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
              echo "**⚠️ Misconfigurations Found:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Show top issues
              jq -r '.Results[]?.Misconfigurations[]? | 
                select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
                "**\(.Severity):** \(.Title)\n- File: `\(.CauseMetadata.Resource // "N/A")`\n- Fix: \(.Resolution)\n"' \
                trivy-config.json | head -30 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            else
              echo "✅ No critical IaC misconfigurations found!" >> $GITHUB_STEP_SUMMARY
              echo "- Infrastructure configurations follow best practices" >> $GITHUB_STEP_SUMMARY
              echo "- Continue reviewing configs during changes" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No IaC files detected or scan not performed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # DAST - Dynamic Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🌐 Wake up DAST target
        if: ${{ inputs.dast_url != '' }}
        run: |
          echo "Pinging ${{ inputs.dast_url }}..."
          curl -sL "${{ inputs.dast_url }}" > /dev/null || true
          sleep 30
        continue-on-error: true

      - name: 🌐 DAST - OWASP ZAP Baseline
        id: dast
        if: ${{ inputs.dast_url != '' }}
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            -v $PWD:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ inputs.dast_url }}" \
            -J zap-report.json \
            -r zap-report.html \
            -T 120 \
            -z "-config spider.maxDuration=3 -config ajaxSpider.maxDuration=3" \
            || true
        continue-on-error: true

      - name: 📊 DAST - Process Results
        if: ${{ inputs.dast_url != '' }}
        run: |
          echo "## 🌐 DAST - Dynamic Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Target:** ${{ inputs.dast_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f zap-report.json ]; then
            # Parse ZAP results
            HIGH=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' zap-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' zap-report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' zap-report.json 2>/dev/null || echo "0")
            INFO=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Informational"))] | length' zap-report.json 2>/dev/null || echo "0")
            TOTAL=$((HIGH + MEDIUM + LOW + INFO))
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| ℹ️ Info | $INFO |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** OWASP ZAP (Zed Attack Proxy)" >> $GITHUB_STEP_SUMMARY
            echo "- **Scan Type:** Baseline (passive + active light)" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage:** OWASP Top 10 vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests:** XSS, SQL Injection, CSRF, Security Headers, etc." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $HIGH -gt 0 ]; then
              echo "**⚠️ High Risk Issues Found:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Show high alerts
              jq -r '.site[].alerts[] | 
                select(.riskdesc | startswith("High")) | 
                "**\(.name)**\n- Risk: \(.riskdesc)\n- Description: \(.desc[0:200])...\n- Solution: \(.solution[0:200])...\n"' \
                zap-report.json | head -50 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
              
              echo "**Action Items:**" >> $GITHUB_STEP_SUMMARY
              echo "1. Review full ZAP HTML report in artifacts" >> $GITHUB_STEP_SUMMARY
              echo "2. Prioritize fixing High severity issues" >> $GITHUB_STEP_SUMMARY
              echo "3. Test fixes in staging before production" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No high-risk DAST issues found!" >> $GITHUB_STEP_SUMMARY
              echo "- Application security posture is good" >> $GITHUB_STEP_SUMMARY
              echo "- Review medium/low findings for improvements" >> $GITHUB_STEP_SUMMARY
              echo "- Check full report for optimization suggestions" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ DAST scan did not produce results" >> $GITHUB_STEP_SUMMARY
            echo "- Check if target URL is accessible" >> $GITHUB_STEP_SUMMARY
            echo "- Verify target is not rate-limiting" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # CodeQL (Optional)
      # ═══════════════════════════════════════════
      
      - name: 🔬 Initialize CodeQL
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: 🔬 CodeQL Analysis
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
        continue-on-error: true

      - name: 📊 CodeQL - Report
        if: ${{ inputs.run_codeql }}
        run: |
          echo "## 🔬 CodeQL - Advanced Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool:** GitHub CodeQL" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** JavaScript/TypeScript" >> $GITHUB_STEP_SUMMARY
          echo "- **Query Pack:** Security Extended" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results available in Security tab:** [Code Scanning Alerts](../../security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # AGGREGATION & FINAL SUMMARY
      # ═══════════════════════════════════════════
      
      - name: 📊 Process & Aggregate Results
        run: |
          # Create compact summary (same as before)
          # ... (keep existing aggregation code)
          
          # Create summary.json
          cat > summary.json << 'EOFMARKER'
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "summary": {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "score": 100
            },
            "scans": {
              "sca": {},
              "sast": {},
              "iac": {},
              "dast": {}
            },
            "findings": []
          }
          EOFMARKER
          
          # Process all scans...
          # (keep existing processing logic)

      - name: 📊 Final Summary
        run: |
          echo "## 🎯 Overall Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download detailed reports from artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Actions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review findings above" >> $GITHUB_STEP_SUMMARY
          echo "2. Download artifacts for detailed analysis" >> $GITHUB_STEP_SUMMARY
          echo "3. Check Security Dashboard for trends" >> $GITHUB_STEP_SUMMARY
          echo "4. Address Critical/High findings within 24-48 hours" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # UPLOAD ARTIFACTS
      # ═══════════════════════════════════════════
      
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            summary.json
            npm-audit.json
            trivy-fs.json
            trivy-config.json
            zap-report.json
            zap-report.html
          retention-days: 30
          if-no-files-found: warn

      # ═══════════════════════════════════════════
      # QUALITY GATE
      # ═══════════════════════════════════════════
      
      - name: 🚨 Security Quality Gate
        run: |
          if [ -f summary.json ]; then
            CRITICAL=$(jq -r '.summary.critical' summary.json)
            
            if [ $CRITICAL -gt 0 ]; then
              echo "❌ CRITICAL vulnerabilities found: $CRITICAL"
              echo "Please fix before merging"
              exit 1
            fi
          fi
          
          echo "✅ No critical vulnerabilities"