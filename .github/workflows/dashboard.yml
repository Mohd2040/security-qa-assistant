name: Update Security Dashboard

on:
  workflow_run:
    workflows: ["Security Vulnerability Test"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: ./reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate Dashboard Data
        run: |
          # Create directory if not exists
          mkdir -p docs/dashboard

          # Initialize variables
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_SHORT=$(date -u +%Y-%m-%d)
          
          # Initialize counts
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          
          # Initialize findings array
          echo "[]" > all_findings.json
          
          # --- 1. Process npm audit ---
          if [ -f reports/npm-audit-report.json ]; then
            echo "Processing npm audit..."
            if jq -e '.metadata' reports/npm-audit-report.json >/dev/null 2>&1; then
              C=$(jq '.metadata.vulnerabilities.critical // 0' reports/npm-audit-report.json)
              H=$(jq '.metadata.vulnerabilities.high // 0' reports/npm-audit-report.json)
              M=$(jq '.metadata.vulnerabilities.moderate // 0' reports/npm-audit-report.json)
              L=$(jq '.metadata.vulnerabilities.low // 0' reports/npm-audit-report.json)
              
              CRITICAL=$((CRITICAL + C))
              HIGH=$((HIGH + H))
              MEDIUM=$((MEDIUM + M))
              LOW=$((LOW + L))
              
              # Extract findings
              jq '[.vulnerabilities | to_entries | .[] | {
                severity: (.value.severity | ascii_upcase),
                title: .value.title,
                package: .value.name,
                source: "npm audit",
                link: (.value.url // "")
              }]' reports/npm-audit-report.json > npm_vulns.json
              
              jq -s '.[0] + .[1]' all_findings.json npm_vulns.json > temp.json && mv temp.json all_findings.json
            fi
          fi
          
          # --- 2. Process Trivy ---
          if [ -f reports/trivy-fs-report.json ]; then
            echo "Processing Trivy..."
            C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy-fs-report.json)
            H=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' reports/trivy-fs-report.json)
            M=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' reports/trivy-fs-report.json)
            L=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' reports/trivy-fs-report.json)
            
            CRITICAL=$((CRITICAL + C))
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract findings
            jq '[.Results[]?.Vulnerabilities[]? | {
              severity: .Severity,
              title: (.Title // .Description // "No description"),
              package: .PkgName,
              source: "Trivy",
              link: (.PrimaryURL // "")
            }]' reports/trivy-fs-report.json > trivy_vulns.json
            
            jq -s '.[0] + .[1]' all_findings.json trivy_vulns.json > temp.json && mv temp.json all_findings.json
          fi
          
          # --- 3. Process ZAP ---
          if [ -f reports/zap-report.json ]; then
            echo "Processing ZAP..."
            H=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' reports/zap-report.json)
            M=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' reports/zap-report.json)
            L=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' reports/zap-report.json)
            
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract findings
            jq '[.site[].alerts[] | {
              severity: (.riskdesc | split(" ")[0] | ascii_upcase),
              title: .name,
              package: "DAST Scan",
              source: "OWASP ZAP",
              link: ""
            }]' reports/zap-report.json > zap_vulns.json
            
            jq -s '.[0] + .[1]' all_findings.json zap_vulns.json > temp.json && mv temp.json all_findings.json
          fi
          
          # --- 4. Calculate Score ---
          # Formula: 100 - (Critical*10 + High*5 + Medium*2 + Low*1)
          PENALTY=$(( (CRITICAL * 10) + (HIGH * 5) + (MEDIUM * 2) + (LOW * 1) ))
          SCORE=$((100 - PENALTY))
          if [ $SCORE -lt 0 ]; then SCORE=0; fi
          
          # --- 5. Update History ---
          # Read existing history if available
          if [ -f docs/dashboard/security-data.json ]; then
            jq '.trends // []' docs/dashboard/security-data.json > history.json
          else
            echo "[]" > history.json
          fi
          
          # Append current run
          jq --arg date "$DATE_SHORT" \
             --argjson c "$CRITICAL" \
             --argjson h "$HIGH" \
             --argjson m "$MEDIUM" \
             --argjson l "$LOW" \
             --argjson s "$SCORE" \
             '. + [{date: $date, critical: $c, high: $h, medium: $m, low: $l, score: $s}] | .[-30:]' \
             history.json > new_history.json
             
          # --- 6. Sort and Limit Findings ---
          # Sort by severity (Critical > High > Medium > Low) and take top 20
          # We use a simple mapping for sorting: Critical=4, High=3, Medium=2, Low=1
          jq 'map(. + {weight: (if .severity=="CRITICAL" then 4 else (if .severity=="HIGH" then 3 else (if .severity=="MEDIUM" then 2 else 1 end) end) end)}) | sort_by(-.weight) | .[0:20] | map(del(.weight))' all_findings.json > top_findings.json
          
          # --- 7. Create Final JSON ---
          jq -n \
             --arg ts "$TIMESTAMP" \
             --argjson c "$CRITICAL" \
             --argjson h "$HIGH" \
             --argjson m "$MEDIUM" \
             --argjson l "$LOW" \
             --argjson s "$SCORE" \
             --slurpfile trends new_history.json \
             --slurpfile vulns top_findings.json \
             '{
               timestamp: $ts,
               summary: {
                 critical: $c,
                 high: $h,
                 medium: $m,
                 low: $l,
                 score: $s
               },
               trends: $trends[0],
               vulnerabilities: $vulns[0]
             }' > docs/dashboard/security-data.json
             
          echo "✅ Dashboard data generated successfully!"
          cat docs/dashboard/security-data.json

      - name: Commit Dashboard Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/dashboard/security-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Update security dashboard data [skip ci]"
          git push
        continue-on-error: true

  deploy-pages:
    needs: update-dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
