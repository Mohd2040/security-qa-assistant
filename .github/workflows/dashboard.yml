name: Security Dashboard (Lightweight)

on:
  workflow_run:
    workflows: ["Security Vulnerability Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: ./reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: 📊 Process Dashboard Data
        run: |
          mkdir -p docs/dashboard
          
          # Check if summary exists
          if [ ! -f reports/summary.json ]; then
            echo "No summary.json found, creating empty"
            echo '{"timestamp":"","summary":{"critical":0,"high":0,"medium":0,"low":0,"score":100},"findings":[]}' > reports/summary.json
          fi
          
          # Read current summary
          TIMESTAMP=$(jq -r '.timestamp' reports/summary.json)
          CRITICAL=$(jq -r '.summary.critical' reports/summary.json)
          HIGH=$(jq -r '.summary.high' reports/summary.json)
          MEDIUM=$(jq -r '.summary.medium' reports/summary.json)
          LOW=$(jq -r '.summary.low' reports/summary.json)
          SCORE=$(jq -r '.summary.score' reports/summary.json)
          
          # Update history (keep last 30 days only)
          if [ -f docs/dashboard/data.json ]; then
            HISTORY=$(jq -r '.history // []' docs/dashboard/data.json)
          else
            HISTORY="[]"
          fi
          
          # Add current data point
          echo "$HISTORY" | jq \
            --arg date "$(date -u +%Y-%m-%d)" \
            --argjson c "$CRITICAL" \
            --argjson h "$HIGH" \
            --argjson m "$MEDIUM" \
            --argjson s "$SCORE" \
            '. + [{date: $date, critical: $c, high: $h, medium: $m, score: $s}] | unique_by(.date) | sort_by(.date) | .[-30:]' \
            > history.json
          
          # Create final dashboard data
          jq -n \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson current "$(cat reports/summary.json)" \
            --slurpfile history history.json \
            '{
              updated: $updated,
              current: $current,
              history: $history[0]
            }' > docs/dashboard/data.json
          
          echo "✅ Dashboard data created"

      - name: 📝 Create Dashboard HTML
        run: |
          cat > docs/dashboard/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Security Dashboard</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                background: #0d1117;
                color: #c9d1d9;
                padding: 20px;
              }
              .container { max-width: 1200px; margin: 0 auto; }
              h1 { margin-bottom: 30px; color: #58a6ff; }
              .stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
              }
              .stat-card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 20px;
                text-align: center;
              }
              .stat-value {
                font-size: 2.5em;
                font-weight: bold;
                margin: 10px 0;
              }
              .stat-label { color: #8b949e; font-size: 0.9em; }
              .critical { color: #f85149; }
              .high { color: #f0883e; }
              .medium { color: #d29922; }
              .low { color: #56d364; }
              .score { 
                font-size: 3em !important;
                background: linear-gradient(135deg, #58a6ff, #79c0ff);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              .chart-container {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 20px;
                margin-bottom: 20px;
              }
              .findings {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 20px;
              }
              .finding {
                padding: 15px;
                border-bottom: 1px solid #30363d;
              }
              .finding:last-child { border-bottom: none; }
              .finding-title { font-weight: bold; margin-bottom: 5px; }
              .finding-meta { color: #8b949e; font-size: 0.9em; }
              .badge {
                display: inline-block;
                padding: 3px 8px;
                border-radius: 3px;
                font-size: 0.8em;
                font-weight: bold;
                margin-right: 5px;
              }
              .badge-critical { background: #f851491a; color: #f85149; }
              .badge-high { background: #f0883e1a; color: #f0883e; }
              .badge-medium { background: #d299221a; color: #d29922; }
              .updated { 
                text-align: center; 
                color: #8b949e; 
                margin-top: 30px; 
                font-size: 0.9em; 
              }
              @media (max-width: 768px) {
                .stats { grid-template-columns: 1fr; }
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🔒 Security Dashboard</h1>
              
              <div class="stats" id="stats"></div>
              
              <div class="chart-container">
                <canvas id="trendChart"></canvas>
              </div>
              
              <div class="findings">
                <h2 style="margin-bottom: 20px;">🎯 Top Findings</h2>
                <div id="findings"></div>
              </div>
              
              <div class="updated" id="updated"></div>
            </div>

            <script>
              fetch('data.json')
                .then(r => r.json())
                .then(data => {
                  // Update stats
                  const current = data.current.summary;
                  const statsHTML = `
                    <div class="stat-card">
                      <div class="stat-label">Security Score</div>
                      <div class="stat-value score">${current.score}</div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">Critical</div>
                      <div class="stat-value critical">${current.critical}</div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">High</div>
                      <div class="stat-value high">${current.high}</div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">Medium</div>
                      <div class="stat-value medium">${current.medium}</div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-label">Low</div>
                      <div class="stat-value low">${current.low}</div>
                    </div>
                  `;
                  document.getElementById('stats').innerHTML = statsHTML;
                  
                  // Trend chart
                  const ctx = document.getElementById('trendChart');
                  new Chart(ctx, {
                    type: 'line',
                    data: {
                      labels: data.history.map(h => h.date),
                      datasets: [
                        {
                          label: 'Security Score',
                          data: data.history.map(h => h.score),
                          borderColor: '#58a6ff',
                          backgroundColor: 'rgba(88, 166, 255, 0.1)',
                          tension: 0.4,
                          fill: true
                        },
                        {
                          label: 'Critical',
                          data: data.history.map(h => h.critical),
                          borderColor: '#f85149',
                          tension: 0.4
                        },
                        {
                          label: 'High',
                          data: data.history.map(h => h.high),
                          borderColor: '#f0883e',
                          tension: 0.4
                        }
                      ]
                    },
                    options: {
                      responsive: true,
                      plugins: {
                        legend: { 
                          labels: { color: '#c9d1d9' }
                        },
                        title: {
                          display: true,
                          text: 'Security Trends (Last 30 Days)',
                          color: '#c9d1d9'
                        }
                      },
                      scales: {
                        y: { 
                          ticks: { color: '#8b949e' },
                          grid: { color: '#30363d' }
                        },
                        x: { 
                          ticks: { color: '#8b949e' },
                          grid: { color: '#30363d' }
                        }
                      }
                    }
                  });
                  
                  // Findings
                  const findings = data.current.findings || [];
                  const findingsHTML = findings.length > 0 
                    ? findings.map(f => `
                        <div class="finding">
                          <div class="finding-title">
                            <span class="badge badge-${f.severity.toLowerCase()}">${f.severity}</span>
                            ${f.title}
                          </div>
                          <div class="finding-meta">
                            📦 ${f.package} | 🔧 Fix: ${f.fix || 'N/A'} | 📍 ${f.source}
                          </div>
                        </div>
                      `).join('')
                    : '<div style="text-align:center;color:#8b949e;padding:40px">✅ No critical or high findings!</div>';
                  
                  document.getElementById('findings').innerHTML = findingsHTML;
                  
                  // Updated time
                  document.getElementById('updated').innerHTML = 
                    `Last updated: ${new Date(data.updated).toLocaleString()}`;
                })
                .catch(e => {
                  console.error('Failed to load data:', e);
                  document.getElementById('stats').innerHTML = 
                    '<div style="grid-column: 1/-1; text-align:center; color:#f85149;">Failed to load dashboard data</div>';
                });
            </script>
          </body>
          </html>
          HTMLEOF
          
          echo "✅ Dashboard HTML created"

      - name: 💾 Commit Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/dashboard/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "📊 Update security dashboard [skip ci]"
          git push
        continue-on-error: true

  deploy-pages:
    needs: update-dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/dashboard'

      - name: 🚀 Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
