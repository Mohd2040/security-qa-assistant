name: Reusable Security Scan (with CodeQL)

on:
  workflow_call:
    inputs:
      project_type:
        description: 'Project type (node, dotnet, python, go, java)'
        required: false
        type: string
        default: 'node'
      run_trivy:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      run_npm_audit:
        description: 'Run npm audit'
        required: false
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL analysis'
        required: false
        type: boolean
        default: true  # Enabled by default
      codeql_languages:
        description: 'CodeQL languages (javascript-typescript, python, go, java, etc.)'
        required: false
        type: string
        default: 'javascript-typescript'
      codeql_queries:
        description: 'CodeQL query suite (security-extended, security-and-quality)'
        required: false
        type: string
        default: 'security-extended'
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: ''
      dast_auth_enabled:
        description: 'Enable authenticated DAST scanning'
        required: false
        type: boolean
        default: false
      dast_login_url:
        description: 'Login page URL for authenticated scanning'
        required: false
        type: string
        default: ''
      dast_username_field:
        description: 'Username field name in login form'
        required: false
        type: string
        default: 'username'
      dast_password_field:
        description: 'Password field name in login form'
        required: false
        type: string
        default: 'password'
      dast_success_indicator:
        description: 'URL pattern or text indicating successful login'
        required: false
        type: string
        default: ''
      defectdojo_enabled:
        description: 'Enable DefectDojo integration'
        required: false
        type: boolean
        default: false

    secrets:
      dast_username:
        description: 'Username for authenticated DAST scanning'
        required: false
      dast_password:
        description: 'Password for authenticated DAST scanning'
        required: false
      DEFECTDOJO_URL:
        description: 'DefectDojo server URL'
        required: false
      DEFECTDOJO_TOKEN:
        description: 'DefectDojo API token'
        required: false
      DEFECTDOJO_PRODUCT_ID:
        description: 'DefectDojo product ID'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: [self-hosted, ubuntudevops]
    #runs-on: ubuntu-latest
    
    steps:
      # ═══════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════
      
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        if: ${{ inputs.project_type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        if: ${{ inputs.project_type == 'node' }}
        run: npm ci --prefer-offline --no-audit

      # ═══════════════════════════════════════════
      # CodeQL - Initialize FIRST (before builds)
      # ═══════════════════════════════════════════
      
      - name: 🔬 Initialize CodeQL
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql_languages }}
          queries: ${{ inputs.codeql_queries }}
          # For compiled languages, add build-mode
          # build-mode: manual

      # ═══════════════════════════════════════════
      # SCA - Software Composition Analysis
      # ═══════════════════════════════════════════

      - name: 🔍 SCA - npm Audit
        id: sca
        if: ${{ inputs.project_type == 'node' && inputs.run_npm_audit }}
        run: |
          set +e

          # Generate JSON report
          npm audit --json > npm-audit.json || true

          # Defaults
          CRITICAL=0
          HIGH=0
          MODERATE=0
          LOW=0
          TOTAL=0

          # Extract metrics safely
          if [ -f npm-audit.json ]; then
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json 2>/dev/null || echo 0)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json 2>/dev/null || echo 0)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit.json 2>/dev/null || echo 0)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit.json 2>/dev/null || echo 0)
            TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit.json 2>/dev/null || echo 0)
          fi

          # Save to outputs (same as your logic)
          {
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

          # Summary header + results (clean)
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🔍 SCA - Software Composition Analysis

          ### 📊 Results:
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | $CRITICAL |
          | 🟠 High | $HIGH |
          | 🟡 Moderate | $MODERATE |
          | 🟢 Low | $LOW |
          | **Total** | **$TOTAL** |

          ### 🛠️ Technology:
          - **Tool:** npm audit (built-in)
          - **Database:** npm registry + GitHub Advisory Database
          - **Coverage:** JavaScript/Node.js dependencies
          - **Scan Scope:** Direct + Transitive dependencies

          ### 💡 Recommendations:
          EOF

          # Recommendations (same condition)
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          **⚠️ Action Required:**
          ```bash
          # Run automatic fix
          npm audit fix

          # For breaking changes
          npm audit fix --force

          # Manual update specific package
          npm update package-name@latest
          ```
          EOF

            # Top vulnerable packages (same idea, but protected)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Top Vulnerable Packages:**" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.vulnerabilities | to_entries
              | sort_by(.value.severity)
              | reverse
              | .[0:5]
              | .[]
              | "- `\(.key)` - \(.value.severity | ascii_upcase) - \(.value.via[0].title // "No title")"' \
              npm-audit.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ✅ No critical or high vulnerabilities found!
          - Continue monitoring for new vulnerabilities
          - Keep dependencies up to date
          - Run `npm update` regularly
          EOF
          fi

          # Footer (same)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      # ═══════════════════════════════════════════
      # SAST - Static Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🛡️ SAST - Trivy Filesystem Scan
        id: sast
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: 'node_modules'
          exit-code: '0'
        continue-on-error: true

      - name: 📊 SAST - Process Trivy Results
        if: ${{ inputs.run_trivy }}
        run: |
          echo "## 🛡️ SAST - Static Application Security Testing (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f trivy-fs.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json)
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs.json)
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs.json)
            TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** Aquasecurity Trivy" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** 0.24.0" >> $GITHUB_STEP_SUMMARY
            echo "- **Database:** Trivy DB (NVD, GitHub Advisories, etc.)" >> $GITHUB_STEP_SUMMARY
            echo "- **Scan Type:** Filesystem (code + dependencies)" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage:** Multi-language support" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "**Languages Detected:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]? | select(.Target) | "- \(.Type // "Unknown"): \(.Target)"' trivy-fs.json | sort -u >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
              echo "**⚠️ Action Required:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Show top vulnerabilities
              echo "**Top Critical/High Vulnerabilities:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| CVE | Severity | Package | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|---------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
              
              jq -r '.Results[]?.Vulnerabilities[]? | 
                select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
                "| [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.Severity) | `\(.PkgName)` | \(.InstalledVersion) | \(.FixedVersion // "N/A") |"' \
                trivy-fs.json | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
              
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Steps to Fix:**" >> $GITHUB_STEP_SUMMARY
              echo "1. Review CVE details (click CVE links above)" >> $GITHUB_STEP_SUMMARY
              echo "2. Update affected packages to fixed versions" >> $GITHUB_STEP_SUMMARY
              echo "3. If no fix available, consider alternatives or apply workarounds" >> $GITHUB_STEP_SUMMARY
              echo "4. Test application after updates" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical or high SAST vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
              echo "- Code analysis shows no major security issues" >> $GITHUB_STEP_SUMMARY
              echo "- Continue following secure coding practices" >> $GITHUB_STEP_SUMMARY
              echo "- Regular security reviews recommended" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Trivy scan did not produce results" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # IaC - Infrastructure as Code
      # ═══════════════════════════════════════════
      
      - name: 🏗️ IaC - Trivy Config Scan
        id: iac
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-config.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        continue-on-error: true

      - name: 📊 IaC - Process Results
        if: ${{ inputs.run_trivy }}
        run: |
          echo "## 🏗️ IaC - Infrastructure as Code Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f trivy-config.json ]; then
            CRITICAL=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL")] | length' trivy-config.json)
            HIGH=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH")] | length' trivy-config.json)
            MEDIUM=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="MEDIUM")] | length' trivy-config.json)
            LOW=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="LOW")] | length' trivy-config.json)
            TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Technology Used
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** Trivy Config Scanner" >> $GITHUB_STEP_SUMMARY
            echo "- **Standards:** CIS Benchmarks, Best Practices" >> $GITHUB_STEP_SUMMARY
            echo "- **Checks:** Security misconfigurations" >> $GITHUB_STEP_SUMMARY
            echo "- **Supported Formats:**" >> $GITHUB_STEP_SUMMARY
            echo "  - Dockerfile" >> $GITHUB_STEP_SUMMARY
            echo "  - Kubernetes (YAML)" >> $GITHUB_STEP_SUMMARY
            echo "  - Terraform" >> $GITHUB_STEP_SUMMARY
            echo "  - Docker Compose" >> $GITHUB_STEP_SUMMARY
            echo "  - Helm Charts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Scan statistics
            SCANNED_COUNT=$(jq '[.Results[]? | select(.Target)] | length' trivy-config.json 2>/dev/null || echo "0")
            echo "### 📁 Scan Coverage:" >> $GITHUB_STEP_SUMMARY
            echo "- **Files Scanned:** $SCANNED_COUNT" >> $GITHUB_STEP_SUMMARY
            
            # Count by type
            if [ $SCANNED_COUNT -gt 0 ]; then
              echo "- **By Type:**" >> $GITHUB_STEP_SUMMARY
              jq -r '[.Results[]? | select(.Target) | .Type] | group_by(.) | .[] | "  - \(.[0]): \(length) file(s)"' trivy-config.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Files scanned
            if [ $SCANNED_COUNT -gt 0 ]; then
              echo "**Scanned Files:**" >> $GITHUB_STEP_SUMMARY
              jq -r '.Results[]? | select(.Target) | "- `\(.Target)` - \(.Type // "unknown")"' trivy-config.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            else
              echo "**No IaC files detected in repository**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "ℹ️ Trivy looks for:" >> $GITHUB_STEP_SUMMARY
              echo "- Dockerfile, docker-compose.yml" >> $GITHUB_STEP_SUMMARY
              echo "- Kubernetes manifests (*.yaml, *.yml)" >> $GITHUB_STEP_SUMMARY
              echo "- Terraform files (*.tf)" >> $GITHUB_STEP_SUMMARY
              echo "- Helm charts" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Recommendations
            echo "### 💡 Recommendations:" >> $GITHUB_STEP_SUMMARY
            if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
              echo "**⚠️ Misconfigurations Found:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Show top issues
              jq -r '.Results[]?.Misconfigurations[]? | 
                select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
                "**\(.Severity):** \(.Title)\n- File: `\(.CauseMetadata.Resource // "N/A")`\n- Fix: \(.Resolution)\n"' \
                trivy-config.json | head -50 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            else
              if [ $SCANNED_COUNT -gt 0 ]; then
                echo "✅ **Excellent! No critical IaC misconfigurations found**" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Your infrastructure configurations passed security checks for:" >> $GITHUB_STEP_SUMMARY
                echo "- CIS Docker Benchmark compliance" >> $GITHUB_STEP_SUMMARY
                echo "- Container security best practices" >> $GITHUB_STEP_SUMMARY
                echo "- Common misconfigurations (exposed secrets, insecure defaults, etc.)" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**Continue following best practices:**" >> $GITHUB_STEP_SUMMARY
                echo "- Review IaC changes in pull requests" >> $GITHUB_STEP_SUMMARY
                echo "- Keep base images updated" >> $GITHUB_STEP_SUMMARY
                echo "- Use non-root users in containers" >> $GITHUB_STEP_SUMMARY
                echo "- Scan regularly for new vulnerabilities" >> $GITHUB_STEP_SUMMARY
              else
                echo "ℹ️ **No IaC files to scan**" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "If you have infrastructure code, ensure it's committed to the repository." >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "ℹ️ No IaC files detected or scan not performed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # CodeQL Analysis (Advanced SAST)
      # ═══════════════════════════════════════════
      
      - name: 🔬 CodeQL - Perform Analysis
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ inputs.codeql_languages }}"
          output: sarif-results
          upload: true
        continue-on-error: true

      - name: 📊 CodeQL - Process Results
        if: ${{ inputs.run_codeql }}
        run: |
          echo "## 🔬 CodeQL - Advanced Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Initialize variables
          FINDINGS="0"
          
          # Count findings from SARIF file
          if [ -d sarif-results ]; then
            FINDINGS=$(find sarif-results -name "*.sarif" -exec jq '[.runs[].results[]] | length' {} + | awk '{s+=$1} END {print s}')
            if [ -z "$FINDINGS" ]; then FINDINGS="0"; fi
          fi
          
          # Display Status Based on Findings
          if [ "$FINDINGS" = "0" ]; then
            echo "✅ **Excellent! CodeQL found ZERO vulnerabilities**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your code passed all security checks:" >> $GITHUB_STEP_SUMMARY
            echo "- No SQL injection vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "- No XSS issues" >> $GITHUB_STEP_SUMMARY
            echo "- No authentication/authorization flaws" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Note:** The Security → Code scanning page will be empty because there are no alerts to show. This is expected and means your code is secure!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **CodeQL found $FINDINGS security issue(s)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **[View detailed findings in Security tab](https://github.com/${{ github.repository }}/security/code-scanning?query=branch%3A${{ github.ref_name }})**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 💡 How to Review:" >> $GITHUB_STEP_SUMMARY
            echo "1. Navigate to: **Security → Code scanning**" >> $GITHUB_STEP_SUMMARY
            echo "2. Filter by severity (Critical, High, Medium, Low)" >> $GITHUB_STEP_SUMMARY
            echo "3. Click on each alert for detailed information" >> $GITHUB_STEP_SUMMARY
            echo "4. Review code location and suggested fix" >> $GITHUB_STEP_SUMMARY
            echo "5. Dismiss false positives or fix issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Scan Statistics
          echo "### 📈 Scan Statistics:" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** ${{ inputs.codeql_languages }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Query Pack:** ${{ inputs.codeql_queries }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Findings:** $FINDINGS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔍 What CodeQL Checked:" >> $GITHUB_STEP_SUMMARY
          echo "- **SQL Injection** vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Cross-Site Scripting (XSS)** issues" >> $GITHUB_STEP_SUMMARY
          echo "- **Path Traversal** vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Command Injection** risks" >> $GITHUB_STEP_SUMMARY
          echo "- **Insecure Deserialization**" >> $GITHUB_STEP_SUMMARY
          echo "- **Cryptographic Issues**" >> $GITHUB_STEP_SUMMARY
          echo "- **Authentication/Authorization** flaws" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Leaks**" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality** issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🎯 CodeQL Advantages:" >> $GITHUB_STEP_SUMMARY
          echo "- **Deep Analysis:** Understands code semantics, not just patterns" >> $GITHUB_STEP_SUMMARY
          echo "- **Low False Positives:** High accuracy in findings" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Flow Analysis:** Tracks data through the entire codebase" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Queries:** Can write organization-specific rules" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Integration:** Alerts on new vulnerabilities in PRs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if SARIF results exist
          if [ -d sarif-results ]; then
            echo "### 📁 SARIF Reports:" >> $GITHUB_STEP_SUMMARY
            echo "CodeQL generated SARIF files for integration with other tools." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # DAST - Dynamic Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🌐 Wake up DAST target
        if: ${{ inputs.dast_url != '' }}
        run: |
          echo "Attempting to wake up ${{ inputs.dast_url }}..."
          
          # Try multiple times to wake up the service (useful for Render free tier)
          for i in {1..5}; do
            echo "Attempt $i/5..."
            if curl -sL -w "%{http_code}" "${{ inputs.dast_url }}" -o /dev/null | grep -q "200\|301\|302"; then
              echo "✅ Target is responding!"
              break
            fi
            echo "Waiting 15 seconds before retry..."
            sleep 15
          done
          
          # Final wait to ensure app is fully ready
          echo "Waiting additional 30 seconds for app to stabilize..."
          sleep 30
        continue-on-error: true

      - name: 🔐 Configure ZAP Authentication
        if: ${{ inputs.dast_url != '' && inputs.dast_auth_enabled }}
        run: |
          mkdir -p zap-config
          
          cat > zap-config/auth-config.yaml << 'EOF'
          env:
            contexts:
            - name: "Authenticated Context"
              urls:
              - "${{ inputs.dast_url }}"
              authentication:
                method: "formBasedAuthentication"
                parameters:
                  loginUrl: "${{ inputs.dast_login_url }}"
                  loginRequestData: "${{ inputs.dast_username_field }}={%username%}&${{ inputs.dast_password_field }}={%password%}"
                verification:
                  method: "response"
                  loggedInRegex: "${{ inputs.dast_success_indicator }}"
                  loggedOutRegex: "(?:Sign in|Login|log in)"
              users:
              - name: "test-user"
                credentials:
                  username: "${{ secrets.dast_username }}"
                  password: "${{ secrets.dast_password }}"
              sessionManagement:
                method: "cookieBasedSessionManagement"
          EOF
          
          echo "✅ ZAP authentication configuration created"
          cat zap-config/auth-config.yaml
        continue-on-error: true

      - name: 🌐 DAST - OWASP ZAP Baseline
        id: dast
        if: ${{ inputs.dast_url != '' }}
        run: |
          mkdir -p zap-output
          # Fix permissions for ZAP container to write reports
          chmod 777 zap-output
          
          # Verify target is accessible before running ZAP
          echo "Verifying target accessibility..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" "${{ inputs.dast_url }}" -o /dev/null || echo "000")
          
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "500" ]; then
            echo "⚠️ Target URL returned HTTP $HTTP_CODE or is not accessible"
            echo "Skipping DAST scan - target may be down or rate-limited"
            echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Target is accessible (HTTP $HTTP_CODE), starting ZAP scan..."
          docker pull ghcr.io/zaproxy/zaproxy:stable

          if [ "${{ inputs.dast_auth_enabled }}" = "true" ]; then
            echo "🔐 Running authenticated ZAP scan..."
            docker run --rm \
              -v "$PWD/zap-output:/zap/wrk:rw" \
              -v "$PWD/zap-config:/zap/config:ro" \
              -u zap \
              -t ghcr.io/zaproxy/zaproxy:stable \
              zap-full-scan.py \
              -t "${{ inputs.dast_url }}" \
              -J zap-report.json \
              -x zap-report.xml \
              -r zap-report.html \
              -T 180 \
              -n /zap/config/auth-config.yaml \
              -U "test-user" \
              -z "-config spider.maxDuration=10 -config ajaxSpider.maxDuration=10" \
              || true
          else
            echo "🌐 Running baseline ZAP scan..."
            docker run --rm \
              -v "$PWD/zap-output:/zap/wrk:rw" \
              -u zap \
              -t ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py \
              -t "${{ inputs.dast_url }}" \
              -J zap-report.json \
              -x zap-report.xml \
              -r zap-report.html \
              -T 180 \
              -z "-config spider.maxDuration=5 -config ajaxSpider.maxDuration=5" \
              || true
          fi

          echo "📄 Reports generated:"
          ls -lah zap-output/ || true

          if [ -f zap-output/zap-report.json ]; then
            echo "✅ JSON report exists"
          else
            echo "⚠️ JSON report missing"
          fi

          if [ -f zap-output/zap-report.xml ]; then
            echo "✅ XML report exists (for DefectDojo)"
          else
            echo "⚠️ XML report missing (DefectDojo needs XML)"
          fi
        continue-on-error: true


      - name: 📊 DAST - Process Results
        if: ${{ inputs.dast_url != '' }}
        run: |
          echo "## 🌐 DAST - Dynamic Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.dast_url }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dast_auth_enabled }}" = "true" ]; then
            echo "**Mode:** 🔐 Authenticated Scan (Full)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** 🌐 Baseline Scan (Unauthenticated)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f zap-output/zap-report.json ]; then
            # Process ZAP results
            HIGH=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            INFO=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Informational"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            
            echo "### 📊 Results:" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| ℹ️ Info | $INFO |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 🛠️ Technology:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool:** OWASP ZAP (Zed Attack Proxy)" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.dast_auth_enabled }}" = "true" ]; then
              echo "- **Scan Type:** Full scan with authentication" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Scan Type:** Baseline (passive + spider)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "- **Timeout:** 180 seconds" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage:** Runtime vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ $HIGH -gt 0 ] || [ $MEDIUM -gt 0 ]; then
              echo "### ⚠️ Findings:" >> $GITHUB_STEP_SUMMARY
              jq -r '.site[].alerts[] | 
                select((.riskdesc | startswith("High")) or (.riskdesc | startswith("Medium"))) | 
                "**\(.riskdesc):** \(.name)\n- **Description:** \(.desc[0:200])...\n- **Solution:** \(.solution[0:150])...\n"' \
                zap-output/zap-report.json | head -50 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            else
              echo "✅ No high or medium DAST vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ DAST scan did not produce results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Possible reasons:**" >> $GITHUB_STEP_SUMMARY
            echo "- Target URL is not accessible" >> $GITHUB_STEP_SUMMARY
            echo "- Application is rate-limiting requests" >> $GITHUB_STEP_SUMMARY
            echo "- Network connectivity issues" >> $GITHUB_STEP_SUMMARY
            echo "- Service is sleeping (Render free tier)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Verify the target URL is publicly accessible" >> $GITHUB_STEP_SUMMARY
            echo "2. Check if the service is running" >> $GITHUB_STEP_SUMMARY
            echo "3. Review rate limiting settings" >> $GITHUB_STEP_SUMMARY
            echo "4. Consider running DAST manually during active hours" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY


      # ═══════════════════════════════════════════
      # AGGREGATION & SUMMARY
      # ═══════════════════════════════════════════
      
      - name: 📊 Process & Aggregate Results
        run: |
          # Create summary.json with all scan data
          cat > summary.json << 'EOFMARKER'
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "summary": {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "score": 100
            },
            "scans": {
              "sca": { "enabled": ${{ inputs.run_npm_audit }}, "tool": "npm audit" },
              "sast_trivy": { "enabled": ${{ inputs.run_trivy }}, "tool": "Trivy" },
              "sast_codeql": { "enabled": ${{ inputs.run_codeql }}, "tool": "CodeQL" },
              "iac": { "enabled": ${{ inputs.run_trivy }}, "tool": "Trivy Config" },
              "dast": { "enabled": ${{ inputs.dast_url != '' }}, "tool": "OWASP ZAP" }
            },
            "findings": []
          }
          EOFMARKER
          
          # Initialize counters
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          
          # Process npm audit
          if [ -f npm-audit.json ]; then
            C=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            H=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json)
            M=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            L=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit.json)
            
            CRITICAL=$((CRITICAL + C))
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract top findings
            jq -r '.vulnerabilities | to_entries | .[] | 
              select(.value.severity == "critical" or .value.severity == "high") | 
              {
                severity: (.value.severity | ascii_upcase),
                title: .value.title,
                package: .key,
                source: "SCA (npm audit)",
                fix: (.value.fixAvailable | if . then "Yes" else "No" end)
              }' npm-audit.json | jq -s '.' > npm-findings.json 2>/dev/null || echo "[]" > npm-findings.json
          else
            echo "[]" > npm-findings.json
          fi
          
          # Process Trivy
          if [ -f trivy-fs.json ]; then
            C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
            H=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json)
            M=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs.json)
            L=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs.json)
            
            CRITICAL=$((CRITICAL + C))
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract top findings
            jq -r '[.Results[]?.Vulnerabilities[]? | 
              select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
              {
                severity: .Severity,
                title: (.Title // .Description // "No title"),
                package: .PkgName,
                cve: .VulnerabilityID,
                source: "SAST (Trivy)",
                fix: (.FixedVersion // "N/A")
              }] | .[0:10]' trivy-fs.json > trivy-findings.json 2>/dev/null || echo "[]" > trivy-findings.json
          else
            echo "[]" > trivy-findings.json


          fi          
          # Process ZAP (DAST)
          if [ -f zap-output/zap-report.json ]; then
            ZH=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            ZM=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            ZL=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
          
            HIGH=$((HIGH + ZH))
            MEDIUM=$((MEDIUM + ZM))
            LOW=$((LOW + ZL))
          
            # Extract top findings (High/Medium)
            jq -r '[.site[].alerts[] |
              select((.riskdesc | startswith("High")) or (.riskdesc | startswith("Medium"))) |
              {
                severity: (.riskdesc | split(" ") | .[0] | ascii_upcase),
                title: .name,
                source: "DAST (OWASP ZAP)",
                url: (.instances[0].uri // .instances[0].url // ""),
                fix: (.solution[0:120] // "See ZAP report")
              }] | .[0:10]' zap-output/zap-report.json > zap-findings.json 2>/dev/null || echo "[]" > zap-findings.json
          else
            echo "[]" > zap-findings.json
          fi

          
          # Merge findings (top 20 only)
          jq -s 'add | sort_by(.severity) | reverse | .[0:20]' npm-findings.json trivy-findings.json zap-findings.json > all-findings.json
          
          # Calculate risk score
          PENALTY=$(( (CRITICAL * 10) + (HIGH * 5) + (MEDIUM * 2) + (LOW * 1) ))
          SCORE=$((100 - PENALTY))
          if [ $SCORE -lt 0 ]; then SCORE=0; fi
          
          # Update summary.json
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --argjson c "$CRITICAL" \
             --argjson h "$HIGH" \
             --argjson m "$MEDIUM" \
             --argjson l "$LOW" \
             --argjson s "$SCORE" \
             --slurpfile findings all-findings.json \
             '.timestamp = $ts | 
              .summary = {critical: $c, high: $h, medium: $m, low: $l, score: $s} |
              .findings = $findings[0]' summary.json > temp.json && mv temp.json summary.json
          
          echo "✅ Summary generated:"
          cat summary.json | jq .summary

      - name: 📊 Final Summary
        run: |
          echo "## 🎯 Overall Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Read summary
          SCORE=$(jq -r '.summary.score' summary.json)
          CRITICAL=$(jq -r '.summary.critical' summary.json)
          HIGH=$(jq -r '.summary.high' summary.json)
          MEDIUM=$(jq -r '.summary.medium' summary.json)
          LOW=$(jq -r '.summary.low' summary.json)
          
          # Risk level
          if [ $SCORE -ge 80 ]; then
            RISK="🟢 LOW"
          elif [ $SCORE -ge 60 ]; then
            RISK="🟡 MEDIUM"
          elif [ $SCORE -ge 40 ]; then
            RISK="🟠 HIGH"
          else
            RISK="🔴 CRITICAL"
          fi
          
          echo "### Overall Risk: $RISK" >> $GITHUB_STEP_SUMMARY
          echo "**Security Score:** $SCORE/100" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Detailed breakdown by source
          echo "### 📊 Findings by Source" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Tool | Critical | High | Medium | Low | Total |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|----------|------|--------|-----|-------|" >> $GITHUB_STEP_SUMMARY
          
          # SCA
          if [ -f npm-audit.json ]; then
            SCA_C=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            SCA_H=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json)
            SCA_M=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            SCA_L=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit.json)
            SCA_T=$((SCA_C + SCA_H + SCA_M + SCA_L))
            echo "| 🔍 SCA | npm audit | $SCA_C | $SCA_H | $SCA_M | $SCA_L | $SCA_T |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 SCA | npm audit | - | - | - | - | N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # SAST (Trivy)
          if [ -f trivy-fs.json ]; then
            TRIVY_C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
            TRIVY_H=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json)
            TRIVY_M=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs.json)
            TRIVY_L=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs.json)
            TRIVY_T=$((TRIVY_C + TRIVY_H + TRIVY_M + TRIVY_L))
            echo "| 🛡️ SAST | Trivy | $TRIVY_C | $TRIVY_H | $TRIVY_M | $TRIVY_L | $TRIVY_T |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🛡️ SAST | Trivy | - | - | - | - | N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # CodeQL
          if [ "${{ inputs.run_codeql }}" = "true" ]; then
            echo "| 🔬 SAST | CodeQL | - | - | - | - | [View Security Tab](https://github.com/${{ github.repository }}/security/code-scanning) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # DAST
          if [ -f zap-output/zap-report.json ]; then
            ZAP_H=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            ZAP_M=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            ZAP_L=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' zap-output/zap-report.json 2>/dev/null || echo "0")
            ZAP_T=$((ZAP_H + ZAP_M + ZAP_L))
            echo "| 🌐 DAST | OWASP ZAP | - | $ZAP_H | $ZAP_M | $ZAP_L | $ZAP_T |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🌐 DAST | OWASP ZAP | - | - | - | - | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Total row
          echo "| **TOTAL** | - | **$CRITICAL** | **$HIGH** | **$MEDIUM** | **$LOW** | **$((CRITICAL + HIGH + MEDIUM + LOW))** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Top Critical/High Findings
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "### 🚨 Top Critical/High Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ -f all-findings.json ]; then
              jq -r '.[] | select(.severity == "CRITICAL" or .severity == "HIGH") | 
                "**\(.severity)** - \(.title // .name // "Unknown")\n- **Source:** \(.source)\n- **Package:** \(.package // "N/A")\n- **CVE:** \(.cve // "N/A")\n- **Fix:** \(.fix // "See detailed report")\n\n---\n"' \
                all-findings.json | head -100 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
          fi
          
          # Quick Fixes Section
          echo "### 🔧 Quick Fixes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f npm-audit.json ] && [ $SCA_C -gt 0 ] || [ $SCA_H -gt 0 ]; then
            echo "**For Node.js/npm vulnerabilities:**" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Try automatic fix" >> $GITHUB_STEP_SUMMARY
            echo "npm audit fix" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# For breaking changes (use with caution)" >> $GITHUB_STEP_SUMMARY
            echo "npm audit fix --force" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Update specific packages" >> $GITHUB_STEP_SUMMARY
            jq -r '.vulnerabilities | to_entries | 
              sort_by(.value.severity) | reverse | .[0:3] | .[] | 
              "npm install \(.key)@latest  # Fix: \(.value.via[0].title // \"vulnerability\")"' \
              npm-audit.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f trivy-fs.json ] && [ $TRIVY_C -gt 0 ] || [ $TRIVY_H -gt 0 ]; then
            echo "**For other vulnerabilities (Python, .NET, etc.):**" >> $GITHUB_STEP_SUMMARY
            echo "- Review CVE links in detailed findings above" >> $GITHUB_STEP_SUMMARY
            echo "- Update affected packages to fixed versions" >> $GITHUB_STEP_SUMMARY
            echo "- Check package manager documentation for update commands" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Scans performed
          echo "### 🔍 Scans Performed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SCA (Software Composition Analysis) - npm audit" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SAST (Static Analysis) - Trivy" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.run_codeql }}" = "true" ]; then
            echo "- ✅ SAST (Advanced) - CodeQL" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- ✅ IaC (Infrastructure) - Trivy Config" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dast_url }}" != "" ]; then
            echo "- ✅ DAST (Dynamic) - OWASP ZAP" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Detailed Reports
          echo "### 📥 Detailed Reports (Artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download full JSON reports from the **Artifacts** section below:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | Description | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ -f npm-audit.json ]; then
            SIZE=$(du -h npm-audit.json | cut -f1)
            echo "| 📄 npm-audit.json | SCA findings (dependencies) | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📄 npm-audit.json | SCA findings | ❌ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f trivy-fs.json ]; then
            SIZE=$(du -h trivy-fs.json | cut -f1)
            echo "| 📄 trivy-fs.json | SAST findings (code + deps) | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📄 trivy-fs.json | SAST findings | ❌ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f trivy-config.json ]; then
            SIZE=$(du -h trivy-config.json | cut -f1)
            echo "| 📄 trivy-config.json | IaC misconfigurations | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📄 trivy-config.json | IaC misconfigurations | ❌ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f zap-output/zap-report.json ]; then
            SIZE=$(du -h zap-output/zap-report.json | cut -f1)
            echo "| 📄 zap-report.json | DAST findings (runtime) | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📄 zap-report.json | DAST findings | ❌ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for CodeQL SARIF files
          if [ -d sarif-results ] && [ "$(ls -A sarif-results/*.sarif 2>/dev/null)" ]; then
            SARIF_COUNT=$(ls -1 sarif-results/*.sarif 2>/dev/null | wc -l)
            SARIF_SIZE=$(du -sh sarif-results | cut -f1)
            echo "| 📄 sarif-results/*.sarif | CodeQL SARIF files | ✅ $SARIF_COUNT file(s), $SARIF_SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📄 sarif-results/*.sarif | CodeQL SARIF files | ❌ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f summary.json ]; then
            SIZE=$(du -h summary.json | cut -f1)
            echo "| 📄 summary.json | Aggregated summary | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Next Steps
          echo "### 📥 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review detailed findings above" >> $GITHUB_STEP_SUMMARY
          echo "2. Download artifacts for full reports" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.run_codeql }}" = "true" ]; then
            echo "3. Check [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) for CodeQL alerts" >> $GITHUB_STEP_SUMMARY
          fi
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "4. **⚠️ Address Critical/High findings within 24-48 hours**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "5. Run suggested fix commands from Quick Fixes section" >> $GITHUB_STEP_SUMMARY



      # ═══════════════════════════════════════════
      # DEFECTDOJO INTEGRATION
      # ═══════════════════════════════════════════

      - name: 📊 Upload to DefectDojo
        # Run only when explicitly enabled (avoids parsing issues with `secrets` in reusable workflows)
        if: ${{ inputs.defectdojo_enabled == true }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT_ID: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e

          echo "## 📊 DefectDojo Integration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PRODUCT_ID="$DEFECTDOJO_PRODUCT_ID"
          ENGAGEMENT_NAME="GitHub Actions - ${BRANCH}"
          # Check secrets (لازم يكون قبل أي API calls)
          if [ -z "$DEFECTDOJO_URL" ] || [ -z "$DEFECTDOJO_TOKEN" ] || [ -z "$PRODUCT_ID" ]; then
            echo "⚠️ DefectDojo upload skipped: missing secrets" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          ENGAGEMENT_ID="$DEFECTDOJO_ENGAGEMENT_ID"

          # Resolve product_name (required by your Dojo)
          PRODUCT_RES=$(curl -sS -L --max-time 20 \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -H "Accept: application/json" \
            -w "\n%{http_code}" \
            "${DEFECTDOJO_URL}/api/v2/products/${PRODUCT_ID}/" || true)

          P_HTTP=$(echo "$PRODUCT_RES" | tail -n1)
          P_BODY=$(echo "$PRODUCT_RES" | sed '$d')

          if [ "$P_HTTP" != "200" ]; then
            echo "❌ Failed to fetch product (HTTP $P_HTTP)" >> $GITHUB_STEP_SUMMARY
            echo "Response: ${P_BODY:0:200}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          PRODUCT_NAME=$(echo "$P_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name',''))" 2>/dev/null || true)

          if [ -z "$PRODUCT_NAME" ]; then
            echo "❌ Could not resolve product_name from product_id=${PRODUCT_ID}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          ENGAGEMENT_NAME="GitHub Actions - ${BRANCH}"
          echo "✅ Using engagement_id=${ENGAGEMENT_ID}" >> $GITHUB_STEP_SUMMARY
          echo "Resolved product_name: ${PRODUCT_NAME}" >> $GITHUB_STEP_SUMMARY

          # 1) Check engagement exists
          ENG_RES=$(curl -sS -L --max-time 20 \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -H "Accept: application/json" \
            -w "\n%{http_code}" \
            "${DEFECTDOJO_URL}/api/v2/engagements/${ENGAGEMENT_ID}/" || true)

          E_HTTP=$(echo "$ENG_RES" | tail -n1)
          if [ "$E_HTTP" != "200" ]; then
            echo "❌ Engagement check failed (HTTP $E_HTTP) — check DEFECTDOJO_ENGAGEMENT_ID" >> $GITHUB_STEP_SUMMARY
            echo "$(echo "$ENG_RES" | sed '$d' | head -c 300)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 2) Quick API sanity
          curl -sS -L --max-time 10 \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -H "Accept: application/json" \
            "${DEFECTDOJO_URL}/api/v2/users/?limit=1" >/dev/null

          echo "✅ API sanity checks passed" >> $GITHUB_STEP_SUMMARY

          echo "🔗 DefectDojo Server: ${DEFECTDOJO_URL}" >> $GITHUB_STEP_SUMMARY
          echo "📦 Product: ${PRODUCT_NAME} (ID: ${PRODUCT_ID})" >> $GITHUB_STEP_SUMMARY
          echo "🌿 Branch: ${BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          UPLOAD_COUNT=0
          UPLOAD_ERRORS=0

          # Function to upload scan results
          upload_to_defectdojo() {
            local SCAN_TYPE="$1"
            local FILE_PATH="$2"
            local TEST_TITLE="$3"

            if [ ! -f "$FILE_PATH" ]; then
              echo "⚠️ Skipping $SCAN_TYPE - file not found: $FILE_PATH"
              return 1
            fi

            echo "📤 Uploading $SCAN_TYPE..."

            RESPONSE=$(curl -sS -L --max-time 60 --connect-timeout 15 \
              -w "\n%{http_code}" \
              -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
              -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
              -F "scan_type=${SCAN_TYPE}" \
              -F "file=@${FILE_PATH}" \
              -F "product_name=${PRODUCT_NAME}" \
              -F "engagement=${ENGAGEMENT_ID}"\
              -F "test_title=${TEST_TITLE}" \
              -F "active=true" \
              -F "verified=false" \
              -F "scan_date=$(date +%Y-%m-%d)" \
              -F "tags=github-actions,${BRANCH},${COMMIT:0:7}" \
              -F "close_old_findings=false" \
              -F "push_to_jira=false")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "✅ $SCAN_TYPE uploaded successfully"
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              return 0
            else
              echo "❌ Failed to upload $SCAN_TYPE (HTTP $HTTP_CODE)"
              echo "Response: $BODY"
              UPLOAD_ERRORS=$((UPLOAD_ERRORS + 1))
              return 1
            fi
          }

          echo "### 📤 Upload Status:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Upload npm audit
          if upload_to_defectdojo "Generic Findings Import" "npm-audit.json" "npm audit - ${COMMIT:0:7}"; then
            echo "- ✅ npm audit uploaded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ npm audit skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # Upload Trivy
          if upload_to_defectdojo "Trivy Scan" "trivy-fs.json" "Trivy FS - ${COMMIT:0:7}"; then
            echo "- ✅ Trivy scan uploaded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ Trivy scan skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # Upload CodeQL SARIF
          if [ -d sarif-results ] && [ "$(ls -A sarif-results/*.sarif 2>/dev/null)" ]; then
            for SARIF_FILE in sarif-results/*.sarif; do
              LANG=$(basename "$SARIF_FILE" .sarif)
              if upload_to_defectdojo "SARIF" "$SARIF_FILE" "CodeQL ${LANG} - ${COMMIT:0:7}"; then
                echo "- ✅ CodeQL SARIF (${LANG}) uploaded" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ⚠️ CodeQL SARIF (${LANG}) failed" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "- ⚠️ CodeQL SARIF skipped (no files)" >> $GITHUB_STEP_SUMMARY
          fi

          # Upload ZAP
          if [ -f "zap-output/zap-report.xml" ]; then
            if upload_to_defectdojo "ZAP Scan" "zap-output/zap-report.xml" "OWASP ZAP - ${COMMIT:0:7}"; then
              echo "- ✅ OWASP ZAP uploaded" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ OWASP ZAP failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⚠️ OWASP ZAP skipped (missing zap-output/zap-report.xml)" >> $GITHUB_STEP_SUMMARY
            ls -lah zap-output >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
        
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Summary:" >> $GITHUB_STEP_SUMMARY
          echo "- **Successful uploads:** $UPLOAD_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed/Skipped:** $UPLOAD_ERRORS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View findings in DefectDojo](${DEFECTDOJO_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      # ═══════════════════════════════════════════
      # UPLOAD ARTIFACTS
      # ═══════════════════════════════════════════
      
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            summary.json
            npm-audit.json
            trivy-fs.json
            trivy-config.json
            zap-output/zap-report.json
            zap-output/zap-report.html
            sarif-results/*.sarif
          retention-days: 30
          if-no-files-found: warn

      # ═══════════════════════════════════════════
      # QUALITY GATE
      # ═══════════════════════════════════════════
      
      - name: 🚨 Security Quality Gate
        run: |
          if [ -f summary.json ]; then
            CRITICAL=$(jq -r '.summary.critical' summary.json)
            
            if [ $CRITICAL -gt 0 ]; then
              echo "❌ CRITICAL vulnerabilities found: $CRITICAL"
              echo "Please fix before merging"
              exit 1
            fi
          fi
          
          echo "✅ No critical vulnerabilities - Quality gate passed"