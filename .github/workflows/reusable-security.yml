name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      project_type:
        description: 'Project type (node, dotnet, etc.)'
        required: false
        type: string
        default: 'node'
      run_trivy:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      run_npm_audit:
        description: 'Run npm audit'
        required: false
        type: boolean
        default: true
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: ''

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ inputs.project_type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        if: ${{ inputs.project_type == 'node' }}
        run: npm ci

      - name: Run npm audit (Dependency Scan - SCA)
        if: ${{ inputs.project_type == 'node' && inputs.run_npm_audit }}
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit > npm-audit-report.txt || true
        continue-on-error: true

      - name: Run OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'security-qa-assistant'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem - SAST)
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Trivy Config Scanner (Misconfiguration)
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-config-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run OWASP ZAP Baseline Scan (DAST)
        if: ${{ inputs.dast_url != '' }}
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.dast_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Generate Security Report Summary
        run: |
          # Create summary report
          cat > security-report.md << 'EOF'
          # Security Vulnerability Report
          
          EOF
          
          echo "**Generated:** $(date)" >> security-report.md
          echo "**Project Type:** ${{ inputs.project_type }}" >> security-report.md
          echo "**DAST Target:** ${{ inputs.dast_url || 'N/A' }}" >> security-report.md
          echo "" >> security-report.md
          echo "---" >> security-report.md
          echo "" >> security-report.md
          
          cat >> security-report.md << 'EOF'
          ## Executive Summary
          
          This report contains automated security scan results:
          
          - **SCA (Software Composition Analysis)**: npm audit + OWASP Dependency-Check
          - **SAST (Static Application Security Testing)**: Trivy filesystem scan
          - **Configuration Analysis**: Trivy config scan
          - **DAST (Dynamic Application Security Testing)**: OWASP ZAP
          
          ---
          
          ## SCA: Dependency Vulnerabilities (npm audit)
          
          EOF
          
          if [ -f npm-audit-report.json ]; then
            echo "**Summary:**" >> security-report.md
            echo "" >> security-report.md
            
            # Check if metadata exists
            if jq -e '.metadata' npm-audit-report.json > /dev/null 2>&1; then
              jq -r '.metadata | "- Total Dependencies: \(.dependencies // 0)\n- Vulnerabilities: \(.vulnerabilities.total // 0)\n- Critical: \(.vulnerabilities.critical // 0)\n- High: \(.vulnerabilities.high // 0)\n- Medium: \(.vulnerabilities.moderate // 0)\n- Low: \(.vulnerabilities.low // 0)"' npm-audit-report.json >> security-report.md
              
              # Add detailed vulnerabilities if any exist
              VULN_COUNT=$(jq '.metadata.vulnerabilities.total // 0' npm-audit-report.json)
              if [ "$VULN_COUNT" -gt 0 ]; then
                echo "" >> security-report.md
                echo "**Top Vulnerabilities:**" >> security-report.md
                echo "" >> security-report.md
                jq -r '.vulnerabilities | to_entries | .[0:5] | .[] | "- **\(.value.name)** (\(.value.severity)): \(.value.title // "No title")"' npm-audit-report.json >> security-report.md 2>/dev/null || echo "Details not available" >> security-report.md
              fi
            else
              echo "No vulnerabilities found or audit passed successfully" >> security-report.md
            fi
          else
            echo '*No npm audit report generated*' >> security-report.md
          fi
          
          cat >> security-report.md << 'EOF'
          
          ---
          
          ## SCA: OWASP Dependency-Check
          
          EOF
          
          if [ -d dependency-check-report ]; then
            echo '*Detailed HTML report available in artifacts*' >> security-report.md
            echo "" >> security-report.md
            
            # Try to extract summary from HTML report
            if [ -f dependency-check-report/dependency-check-report.html ]; then
              echo "Report generated successfully. Download artifacts for full details." >> security-report.md
            fi
          else
            echo '*No Dependency-Check report generated*' >> security-report.md
          fi
          
          cat >> security-report.md << 'EOF'
          
          ---
          
          ## SAST: Trivy Filesystem Scan
          
          EOF
          
          if [ -f trivy-fs-report.json ]; then
            # Check if there are any results
            RESULTS_COUNT=$(jq '[.Results[]?] | length' trivy-fs-report.json)
            
            if [ "$RESULTS_COUNT" -gt 0 ]; then
              echo "**Vulnerabilities Found:**" >> security-report.md
              echo "" >> security-report.md
              
              # Group by severity
              jq -r '.Results[]? | select(.Vulnerabilities) | .Vulnerabilities | group_by(.Severity) | map({Severity: .[0].Severity, Count: length}) | .[] | "- \(.Severity): \(.Count)"' trivy-fs-report.json >> security-report.md 2>/dev/null || echo "No vulnerabilities found" >> security-report.md
              
              # Add top 5 critical/high vulnerabilities
              echo "" >> security-report.md
              echo "**Top Critical/High Vulnerabilities:**" >> security-report.md
              echo "" >> security-report.md
              jq -r '.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "- **\(.VulnerabilityID)** (\(.Severity)): \(.Title // .Description // "No description") - Package: \(.PkgName)"' trivy-fs-report.json | head -10 >> security-report.md 2>/dev/null || echo "No critical/high vulnerabilities" >> security-report.md
            else
              echo "✅ No vulnerabilities found in filesystem scan" >> security-report.md
            fi
          else
            echo '*No Trivy filesystem report generated*' >> security-report.md
          fi
          
          cat >> security-report.md << 'EOF'
          
          ---
          
          ## Configuration Scan
          
          EOF
          
          if [ -f trivy-config-report.json ]; then
            RESULTS_COUNT=$(jq '[.Results[]?] | length' trivy-config-report.json)
            
            if [ "$RESULTS_COUNT" -gt 0 ]; then
              echo "**Misconfigurations Found:**" >> security-report.md
              echo "" >> security-report.md
              
              # Group by severity
              jq -r '.Results[]? | select(.Misconfigurations) | .Misconfigurations | group_by(.Severity) | map({Severity: .[0].Severity, Count: length}) | .[] | "- \(.Severity): \(.Count)"' trivy-config-report.json >> security-report.md 2>/dev/null || echo "No misconfigurations found" >> security-report.md
              
              # Add details
              echo "" >> security-report.md
              echo "**Details:**" >> security-report.md
              echo "" >> security-report.md
              jq -r '.Results[]? | select(.Misconfigurations) | .Misconfigurations[] | select(.Severity == "CRITICAL" or .Severity == "HIGH" or .Severity == "MEDIUM") | "- **\(.ID)** (\(.Severity)): \(.Title) - File: \(.CauseMetadata.Resource // "N/A")"' trivy-config-report.json | head -10 >> security-report.md 2>/dev/null || echo "No significant misconfigurations" >> security-report.md
            else
              echo "✅ No misconfigurations found" >> security-report.md
            fi
          else
            echo '*No Trivy config report generated*' >> security-report.md
          fi
          
          cat >> security-report.md << 'EOF'
          
          ---
          
          ## DAST: OWASP ZAP Scan
          
          EOF
          
          if [ -f report_html.html ]; then
            echo "**ZAP Scan Completed**" >> security-report.md
            echo "" >> security-report.md
            echo "Target: ${{ inputs.dast_url }}" >> security-report.md
            echo "" >> security-report.md
            echo '*Full ZAP HTML report available in artifacts*' >> security-report.md
            
            # Try to extract summary from ZAP report
            if [ -f report_json.json ]; then
              echo "" >> security-report.md
              echo "**Alert Summary:**" >> security-report.md
              jq -r '.site[0].alerts[] | "- **\(.name)** (Risk: \(.riskdesc)): \(.desc[0:100])..."' report_json.json 2>/dev/null >> security-report.md || echo "See HTML report for details" >> security-report.md
            fi
          else
            echo '*No DAST scan performed*' >> security-report.md
            echo "" >> security-report.md
            if [ -z "${{ inputs.dast_url }}" ]; then
              echo "ℹ️ To enable DAST scanning, provide a target URL when running the workflow manually." >> security-report.md
            else
              echo "⚠️ DAST scan was requested but did not complete. Check workflow logs for errors." >> security-report.md
            fi
          fi

      - name: Install Pandoc for PDF Generation
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Convert Report to PDF
        run: |
          pandoc security-report.md -o security-report.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V colorlinks=true \
            -V mainfont="DejaVu Sans"
        continue-on-error: true

      - name: Enforce Security Policy (CRITICAL Vulnerabilities)
        run: |
          echo "=== Security Policy Enforcement ==="
          
          # Check npm audit for CRITICAL vulnerabilities
          if [ -f npm-audit-report.json ]; then
            NPM_CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            echo "npm audit - CRITICAL: $NPM_CRITICAL"
          else
            NPM_CRITICAL=0
          fi
          
          # Check Trivy for CRITICAL vulnerabilities
          if [ -f trivy-fs-report.json ]; then
            TRIVY_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs-report.json)
            echo "Trivy - CRITICAL: $TRIVY_CRITICAL"
          else
            TRIVY_CRITICAL=0
          fi
          
          TOTAL_CRITICAL=$((NPM_CRITICAL + TRIVY_CRITICAL))
          
          echo ""
          echo "📊 Security Summary:"
          echo "  - npm audit CRITICAL: $NPM_CRITICAL"
          echo "  - Trivy CRITICAL: $TRIVY_CRITICAL"
          echo "  - TOTAL CRITICAL: $TOTAL_CRITICAL"
          echo ""
          
          if [ $TOTAL_CRITICAL -gt 0 ]; then
            echo "❌ SECURITY POLICY VIOLATION"
            echo "Found $TOTAL_CRITICAL CRITICAL vulnerabilities"
            echo "Deployment BLOCKED per security policy"
            echo "Required action: Fix CRITICAL vulnerabilities within 24 hours"
            exit 1
          else
            echo "✅ No CRITICAL vulnerabilities found"
            echo "Security policy compliance: PASS"
          fi

      - name: Display Reports in Logs
        run: |
          echo "=== Security Report Summary ==="
          cat security-report.md

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit-report.json
            npm-audit-report.txt
            trivy-fs-report.json
            trivy-config-report.json
            dependency-check-report/
            security-report.md
            security-report.pdf
            report_html.html
          if-no-files-found: ignore
