name: Reusable Security Scan (Optimized)

on:
  workflow_call:
    inputs:
      project_type:
        description: 'Project type (node, dotnet, etc.)'
        required: false
        type: string
        default: 'node'
      run_trivy:
        description: 'Run Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      run_npm_audit:
        description: 'Run npm audit'
        required: false
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL analysis'
        required: false
        type: boolean
        default: false  # Disabled by default (slow)
      dast_url:
        description: 'Target URL for DAST scan (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      # ═══════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════
      
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        if: ${{ inputs.project_type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        if: ${{ inputs.project_type == 'node' }}
        run: npm ci --prefer-offline --no-audit

      # ═══════════════════════════════════════════
      # SCA - Software Composition Analysis
      # ═══════════════════════════════════════════
      
      - name: 🔍 npm Audit (SCA)
        if: ${{ inputs.project_type == 'node' && inputs.run_npm_audit }}
        run: |
          # Generate JSON report (small)
          npm audit --json > npm-audit.json || true
          
          # Generate summary only (not full text)
          npm audit --audit-level=moderate 2>&1 | head -100 > npm-audit-summary.txt || true
        continue-on-error: true

      # ═══════════════════════════════════════════
      # SAST - Static Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🛡️ Trivy Filesystem Scan (SAST)
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: 'node_modules'  # Skip node_modules for speed
          exit-code: '0'
        continue-on-error: true

      - name: 🛡️ Trivy Config Scan (IaC)
        if: ${{ inputs.run_trivy }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-config.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        continue-on-error: true

      # ═══════════════════════════════════════════
      # DAST - Dynamic Application Security Testing
      # ═══════════════════════════════════════════
      
      - name: 🌐 Wake up DAST target
        if: ${{ inputs.dast_url != '' }}
        run: |
          echo "Pinging ${{ inputs.dast_url }}..."
          curl -sL "${{ inputs.dast_url }}" > /dev/null || true
          sleep 30
        continue-on-error: true

      - name: 🌐 OWASP ZAP Baseline (DAST)
        if: ${{ inputs.dast_url != '' }}
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            -v $PWD:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ inputs.dast_url }}" \
            -J zap-report.json \
            -T 120 \
            -z "-config spider.maxDuration=3 -config ajaxSpider.maxDuration=3" \
            || true
        continue-on-error: true

      # ═══════════════════════════════════════════
      # CodeQL (Optional - Slow)
      # ═══════════════════════════════════════════
      
      - name: 🔬 Initialize CodeQL
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: 🔬 CodeQL Analysis
        if: ${{ inputs.run_codeql }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
        continue-on-error: true

      # ═══════════════════════════════════════════
      # PROCESSING & REPORTING
      # ═══════════════════════════════════════════
      
      - name: 📊 Process & Aggregate Results
        run: |
          # Create compact summary
          cat > summary.json << 'EOFMARKER'
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "summary": {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "score": 100
            },
            "findings": []
          }
          EOFMARKER
          
          # Initialize counters
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          
          # Process npm audit
          if [ -f npm-audit.json ]; then
            C=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json)
            H=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json)
            M=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit.json)
            L=$(jq -r '.metadata.vulnerabilities.low // 0' npm-audit.json)
            
            CRITICAL=$((CRITICAL + C))
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract top 10 npm findings
            jq -r '.vulnerabilities | to_entries | .[] | 
              select(.value.severity == "critical" or .value.severity == "high") | 
              {
                severity: (.value.severity | ascii_upcase),
                title: .value.title,
                package: .key,
                source: "npm",
                fix: (.value.fixAvailable | if . then "Yes" else "No" end)
              }' npm-audit.json | jq -s '.' > npm-findings.json 2>/dev/null || echo "[]" > npm-findings.json
          else
            echo "[]" > npm-findings.json
          fi
          
          # Process Trivy
          if [ -f trivy-fs.json ]; then
            C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
            H=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json)
            M=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs.json)
            L=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs.json)
            
            CRITICAL=$((CRITICAL + C))
            HIGH=$((HIGH + H))
            MEDIUM=$((MEDIUM + M))
            LOW=$((LOW + L))
            
            # Extract top 10 trivy findings
            jq -r '[.Results[]?.Vulnerabilities[]? | 
              select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
              {
                severity: .Severity,
                title: (.Title // .Description // "No title"),
                package: .PkgName,
                cve: .VulnerabilityID,
                source: "trivy",
                fix: (.FixedVersion // "N/A")
              }] | .[0:10]' trivy-fs.json > trivy-findings.json 2>/dev/null || echo "[]" > trivy-findings.json
          else
            echo "[]" > trivy-findings.json
          fi
          
          # Merge findings (top 20 only)
          jq -s 'add | sort_by(.severity) | reverse | .[0:20]' npm-findings.json trivy-findings.json > all-findings.json
          
          # Calculate risk score
          PENALTY=$(( (CRITICAL * 10) + (HIGH * 5) + (MEDIUM * 2) + (LOW * 1) ))
          SCORE=$((100 - PENALTY))
          if [ $SCORE -lt 0 ]; then SCORE=0; fi
          
          # Update summary
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --argjson c "$CRITICAL" \
             --argjson h "$HIGH" \
             --argjson m "$MEDIUM" \
             --argjson l "$LOW" \
             --argjson s "$SCORE" \
             --slurpfile findings all-findings.json \
             '.timestamp = $ts | 
              .summary = {critical: $c, high: $h, medium: $m, low: $l, score: $s} |
              .findings = $findings[0]' summary.json > temp.json && mv temp.json summary.json
          
          echo "✅ Summary generated:"
          cat summary.json | jq .summary

      - name: 📝 Generate Markdown Report
        run: |
          cat > SECURITY_REPORT.md << 'EOF'
          # 🔒 Security Report
          
          **Generated:** $(date)  
          **Repository:** ${{ github.repository }}  
          **Branch:** ${{ github.ref_name }}
          
          ---
          
          ## 📊 Summary
          
          EOF
          
          # Extract from summary.json
          CRITICAL=$(jq -r '.summary.critical' summary.json)
          HIGH=$(jq -r '.summary.high' summary.json)
          MEDIUM=$(jq -r '.summary.medium' summary.json)
          LOW=$(jq -r '.summary.low' summary.json)
          SCORE=$(jq -r '.summary.score' summary.json)
          
          # Risk level
          if [ $SCORE -ge 80 ]; then
            RISK="🟢 LOW"
          elif [ $SCORE -ge 60 ]; then
            RISK="🟡 MEDIUM"
          elif [ $SCORE -ge 40 ]; then
            RISK="🟠 HIGH"
          else
            RISK="🔴 CRITICAL"
          fi
          
          cat >> SECURITY_REPORT.md << EOF
          **Risk Level:** $RISK  
          **Security Score:** $SCORE/100
          
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | $CRITICAL |
          | 🟠 High | $HIGH |
          | 🟡 Medium | $MEDIUM |
          | 🟢 Low | $LOW |
          
          ---
          
          ## 🎯 Top Priority Findings
          
          EOF
          
          # Add findings table
          if [ -f all-findings.json ] && [ $(jq 'length' all-findings.json) -gt 0 ]; then
            echo "| Severity | Title | Package | Fix |" >> SECURITY_REPORT.md
            echo "|----------|-------|---------|-----|" >> SECURITY_REPORT.md
            
            jq -r '.[] | "| \(.severity) | \(.title[0:50])... | `\(.package)` | \(.fix // "N/A") |"' all-findings.json >> SECURITY_REPORT.md
          else
            echo "✅ **No critical or high findings!**" >> SECURITY_REPORT.md
          fi
          
          cat >> SECURITY_REPORT.md << 'EOF'
          
          ---
          
          ## 🛠️ Remediation
          
          ### For npm vulnerabilities:
          ```bash
          npm audit fix
          npm audit fix --force  # If needed
          ```
          
          ### For code vulnerabilities:
          - Review Trivy findings in artifacts
          - Update affected packages
          - Apply security patches
          
          ---
          
          **Full details available in artifacts**
          
          EOF

      - name: 📊 Update GitHub Summary
        if: always()
        run: |
          cat SECURITY_REPORT.md >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════
      # UPLOAD ARTIFACTS (Lightweight!)
      # ═══════════════════════════════════════════
      
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            summary.json
            SECURITY_REPORT.md
            npm-audit.json
            trivy-fs.json
            trivy-config.json
            zap-report.json
          retention-days: 30
          if-no-files-found: warn

      # ═══════════════════════════════════════════
      # QUALITY GATE
      # ═══════════════════════════════════════════
      
      - name: 🚨 Security Quality Gate
        run: |
          CRITICAL=$(jq -r '.summary.critical' summary.json)
          
          if [ $CRITICAL -gt 0 ]; then
            echo "❌ CRITICAL vulnerabilities found: $CRITICAL"
            echo "Please fix before merging"
            exit 1
          fi
          
          echo "✅ No critical vulnerabilities"
